name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/contract-check.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: core 单测 + 库 / demo 构建
        working-directory: android
        run: ./gradlew :core:test :cipher-visual:assembleRelease :demo:assembleDebug --console=plain

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 纯逻辑单测（macOS 主机，含 golden 对拍）
        run: swift test
      - name: UIKit 层编译（iOS 模拟器 SDK）
        run: xcodebuild build -scheme CipherVisual-Package -destination 'generic/platform=iOS Simulator' -quiet
